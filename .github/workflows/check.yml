name: Revisión del sitio

# GitHub Pages publica lo que haya en main, sin construir nada. Esta revisión
# es lo único que hay entre un archivo roto y el sitio en producción.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revisar integridad del sitio
        run: node tools/check-integrity.mjs
